name: Revert sing-tun changes

on:
  push:
    branches:
      - agent/revert-sing-tun-changes
    paths:
      - .github/workflows/revert-sing-tun.yml

permissions:
  contents: write

concurrency:
  group: revert-sing-tun-changes
  cancel-in-progress: false

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out rollback branch
        uses: actions/checkout@v6
        with:
          ref: agent/revert-sing-tun-changes
          fetch-depth: 0

      - name: Revert sing-tun synchronization work
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Undo the compatibility-port PR, the post-merge trigger cleanup,
          # and the original sing-tun synchronization PR. Keep the unrelated
          # Android platform commit that landed between the two PRs.
          git revert --no-commit -m 1 4058ea9b9a9cad33b10a4773b98db10ec0332e07
          git revert --no-commit d1904b2319aee0086aca2ef80536244001cdb663
          git revert --no-commit -m 1 55bca98b5f15af4e9e565f370e222a9180968009

          git rm .github/workflows/revert-sing-tun.yml
          git commit -m "revert: restore original sing-tun setup"
          git push origin HEAD:refs/heads/agent/revert-sing-tun-changes

          # Remove the generated integration module branch. It is no longer
          # referenced after the rollback.
          git push origin --delete sing-tun-meta-upstream || true
