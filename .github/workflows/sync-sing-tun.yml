name: Port upstream sing-tun onto Meta

on:
  push:
    branches:
      - Alpha
      - agent/port-upstream-sing-tun
    paths:
      - .github/workflows/sync-sing-tun.yml
      - .github/scripts/port-sing-tun.sh
      - .github/scripts/update-mihomo-sing-tun.sh
  pull_request:
    branches:
      - Alpha
    paths:
      - .github/workflows/sync-sing-tun.yml
      - .github/scripts/port-sing-tun.sh
      - .github/scripts/update-mihomo-sing-tun.sh
  schedule:
    - cron: "53 */6 * * *"
  workflow_dispatch:

concurrency:
  group: port-upstream-sing-tun-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.event_name == 'push' && github.ref_name || 'Alpha' }}
  INTEGRATION_BRANCH: sing-tun-meta-upstream
  META_REPOSITORY: MetaCubeX/sing-tun
  META_BRANCH: meta
  UPSTREAM_REPOSITORY: SagerNet/sing-tun
  UPSTREAM_BRANCH: dev
  INITIAL_UPSTREAM_CUTOFF: "2026-06-22T06:51:36Z"
  GOTOOLCHAIN: local
  GOEXPERIMENT: simd
  CGO_ENABLED: 0
  SKIP_CONCURRENT_TEST: 1
  SKIP_INTEROP_TEST: 1

jobs:
  port:
    name: Port compatible commits onto Meta
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out Mihomo target
        uses: actions/checkout@v6
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          path: mihomo

      - name: Set up MetaCubeX Go 1.26
        uses: actions/setup-go@v6
        with:
          go-download-base-url: https://github.com/MetaCubeX/go/releases/download/build
          go-version: "1.26"
          cache: false

      - name: Build and publish Meta-compatible sing-tun
        id: port
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_REPOSITORY: ${{ github.repository }}
        run: bash mihomo/.github/scripts/port-sing-tun.sh

      - name: Upload port diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sing-tun-port-debug-${{ github.run_attempt }}
          path: port-debug.log
          if-no-files-found: warn

      - name: Point Mihomo at the tested integration branch
        id: update
        shell: bash
        env:
          INTEGRATION_VERSION: ${{ steps.port.outputs.integration_version }}
          REPLACEMENT_REPOSITORY: github.com/${{ github.repository }}
        working-directory: mihomo
        run: bash .github/scripts/update-mihomo-sing-tun.sh

      - name: Commit Mihomo dependency update
        if: steps.update.outputs.changed == 'true'
        shell: bash
        env:
          INTEGRATION_SHA: ${{ steps.port.outputs.integration_sha }}
        working-directory: mihomo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git commit -m "chore: port upstream sing-tun ${INTEGRATION_SHA:0:12}"

          remote_sha="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk 'NR == 1 { print $1 }')"
          base_sha="$(git rev-parse HEAD^)"
          if [[ "$remote_sha" != "$base_sha" ]]; then
            echo "Target branch moved from ${base_sha} to ${remote_sha}; refusing to overwrite it." >&2
            exit 1
          fi

          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
