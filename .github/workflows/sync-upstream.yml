name: Sync upstream Alpha

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream-alpha
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out downstream dev
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Mirror upstream Alpha and open review PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/MetaCubeX/mihomo.git
          git fetch --no-tags upstream Alpha
          git fetch --no-tags origin Alpha dev

          upstream_sha="$(git rev-parse upstream/Alpha)"
          current_alpha="$(git rev-parse origin/Alpha)"

          if [ "$upstream_sha" != "$current_alpha" ]; then
            git push \
              --force-with-lease="refs/heads/Alpha:${current_alpha}" \
              origin "${upstream_sha}:refs/heads/Alpha"
          fi

          if git merge-base --is-ancestor "$upstream_sha" HEAD; then
            echo "dev already contains upstream Alpha ${upstream_sha:0:8}."
            exit 0
          fi

          pr_number="$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --state open \
            --base dev \
            --head Alpha \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "$pr_number" ]; then
            echo "Upstream review PR #${pr_number} already tracks Alpha."
            exit 0
          fi

          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base dev \
            --head Alpha \
            --title "chore: sync upstream Alpha ${upstream_sha:0:8}" \
            --body "Automated upstream sync. Review conflicts and CI before merging into dev."
